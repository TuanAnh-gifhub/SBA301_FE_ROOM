name: CICD_test

on:
  push:
    branches: ["feature/be/message"]

jobs:
  # =========================
  # JOB 1: BUILD & PUSH IMAGE
  # =========================
  build-and-push:
    # Chạy trên máy ảo Ubuntu mới nhất của GitHub
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Clone source code từ repo về runner
      - name: Checkout Code
        uses: actions/checkout@v3

      # =========================
      # LOGIN DOCKER HUB
      # =========================
      # Đăng nhập Docker Hub để có quyền push image
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          # Lấy username và password từ GitHub Secrets
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image cho backend và push lên Docker Hub
      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rent-room-backend:latest
          # Image sẽ có dạng:
          # docker.io/username/rent-room-backend:latest

      # =========================
      # BUILD FRONTEND
      # =========================
      # Build và push Docker image cho frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rent-room-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_ID=${{ secrets.VITE_GOOGLE_ID }}
          # Image frontend sẽ được push với tag latest

